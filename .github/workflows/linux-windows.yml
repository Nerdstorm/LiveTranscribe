# Checks the Linux and Windows app (linux-windows/) on both systems: formatting, lints and tests.
# The tests include the golden cases shared with the Mac app, so a change to Fixtures/golden runs
# them too.
name: Linux and Windows

on:
  push:
    branches: [main]
    paths:
      - "linux-windows/**"
      - "Fixtures/golden/**"
      - ".github/workflows/linux-windows.yml"
  pull_request:
    paths:
      - "linux-windows/**"
      - "Fixtures/golden/**"
      - ".github/workflows/linux-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run in progress.
concurrency:
  group: linux-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: linux-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      # cpal records the microphone through ALSA, and the tray is Tauri's, which builds against
      # WebKitGTK, libxdo and the app indicator library (Tauri's list for Ubuntu).
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          pkg-config libasound2-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: linux-windows
      # The speech-only sherpa-onnx libraries, which the sherpa-onnx crate links (.cargo/config.toml).
      - name: Fetch the sherpa-onnx libraries
        shell: bash
        run: packaging/fetch-sherpa-onnx.sh
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      # A catalog model through sherpa-onnx: Moonshine tiny (English, 30 MB), checked against its
      # SHA-256, transcribes its own test clip. The test gets the model's folder as the system spells
      # paths (cygpath, in Windows' Git Bash).
      - name: Transcribe with sherpa-onnx
        shell: bash
        env:
          MODEL: sherpa-onnx-moonshine-tiny-en-quantized-2026-02-27
          SHA256: 9ec31b342d8fa3240c3b81b8f82e1cf7e3ac467c93ca5a999b741d5887164f8d
        run: |
          mkdir -p target/models
          curl --fail --location --retry 3 --silent --show-error --output "target/models/$MODEL.tar.bz2" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$MODEL.tar.bz2"
          echo "$SHA256  target/models/$MODEL.tar.bz2" | sha256sum --check
          tar -xjf "target/models/$MODEL.tar.bz2" -C target/models
          folder=$PWD/target/models/$MODEL
          if command -v cygpath >/dev/null; then folder=$(cygpath --windows "$folder"); fi
          LT_SHERPA_MOONSHINE_DIR=$folder cargo test -p lt-transcription --locked --test sherpa -- --ignored
