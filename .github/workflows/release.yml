# Builds Live Transcribe for every system from one tag vX.Y.Z, and drafts one GitHub release with
# all of it for the owner to publish (docs/releasing.md):
# - the Mac app's disk image: built, signed with Developer ID, notarized and signed as an update by
#   scripts/release.sh, with the Xcode the app is released with. The keys are secrets of the release
#   environment, which waits for the owner's approval;
# - the Linux app's deb, rpm and AppImage, built in Ubuntu 22.04, whose glibc (2.35) sets the
#   oldest distributions they run on, with the OpenVINO runtime they carry
#   (linux-windows/packaging/linux/fetch-openvino.sh).
# Every system gets the tag's version. The Windows app joins once it has an installer.
#
# A pull request that changes how they're made builds them as test builds, to try from the run's
# artifacts: the Mac's is ad-hoc signed and not notarized. So does a run started by hand, unless
# it's a rehearsal, which builds the Mac app signed and notarized as a release would, to try the
# keys, and releases nothing.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/release-notes.md"
      - "scripts/release.sh"
      - "scripts/release-notes.sh"
      - "scripts/check-swift-runtime.sh"
      - "scripts/verify-update-signature.swift"
      - "linux-windows/packaging/**"
      - "linux-windows/crates/app/tauri*.json"
      - "linux-windows/vendor/openvino/**"
  workflow_dispatch:
    inputs:
      rehearse:
        description: Sign and notarize the Mac app as a release would, without releasing anything
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a pull request replaces its run. A release always runs to the end.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  plan:
    name: Plan the build
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      kind: ${{ steps.plan.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            .github/release-notes.md
            scripts/release-notes.sh
          sparse-checkout-cone-mode: false
      # A release takes its version from its tag; test builds and rehearsals are 0.0.0.
      - id: plan
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          REHEARSE: ${{ inputs.rehearse }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version=${TAG#v}
            if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "The tag $TAG doesn't name a version vX.Y.Z" >&2
              exit 1
            fi
            # The notes are the changelog's section for the release: without it, stop now rather
            # than after the builds.
            scripts/release-notes.sh "$version" > /dev/null
            kind=release
          elif [ "$REHEARSE" = true ]; then
            version=0.0.0 kind=rehearsal
          else
            version=0.0.0 kind=test
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Building $version, as a $kind." >> "$GITHUB_STEP_SUMMARY"

  mac:
    name: Build the Mac app
    needs: plan
    # GitHub's image with Xcode 27, a preview for now.
    runs-on: xcode-27
    # The signing keys are the release environment's, which waits for the owner's approval. Test
    # builds don't use them.
    environment: ${{ needs.plan.outputs.kind != 'test' && 'release' || '' }}
    # Apple's notary service can take an hour or more.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      KIND: ${{ needs.plan.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # release.sh numbers the build by the commits up to it.
          fetch-depth: 0
      # The Xcode the app is released with, and was last released with from a Mac.
      - name: Use Xcode 27.0
        run: sudo xcode-select --switch /Applications/Xcode_27.0.app
      - name: Install the Metal Toolchain, which builds MLX's shaders
        run: xcrun metal -v > /dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Put the signing keys in a keychain of their own
        if: env.KIND != 'test'
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_KEY }}
        run: |
          umask 077
          keys="$RUNNER_TEMP/keys"
          mkdir "$keys"
          echo "KEYS=$keys" >> "$GITHUB_ENV"
          keychain="$keys/signing.keychain-db"
          password=$(openssl rand -base64 32)
          security create-keychain -p "$password" "$keychain"
          # Unlocked for as long as the job may take.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPER_ID_CERTIFICATE" | base64 --decode > "$keys/developer-id.p12"
          security import "$keys/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$keys/developer-id.p12"
          # Lets codesign and Xcode use the key without asking, and puts the keychain first where
          # they look.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          read -r -a others < <(security list-keychains -d user | tr -d '"' | xargs)
          security list-keychains -d user -s "$keychain" "${others[@]}"
          printf '%s\n' "$NOTARY_KEY" > "$keys/notary-key.p8"
          printf '%s\n' "$SPARKLE_KEY" > "$keys/update-key.txt"
      - name: Build the app
        env:
          LT_TEAM_ID: ${{ secrets.TEAM_ID }}
          LT_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          LT_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          case $KIND in
            test)
              scripts/release.sh "$VERSION" --test
              ;;
            *)
              export LT_NOTARY_KEY_FILE="$KEYS/notary-key.p8" LT_SPARKLE_KEY_FILE="$KEYS/update-key.txt"
              if [ "$KIND" = rehearsal ]; then
                scripts/release.sh "$VERSION" --rehearse
              else
                scripts/release.sh "$VERSION"
              fi
              ;;
          esac
      - name: Remove the signing keys
        if: always() && env.KEYS != ''
        run: |
          security delete-keychain "$KEYS/signing.keychain-db" || true
          rm -rf "$KEYS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-app
          path: build/release/${{ env.VERSION }}/LiveTranscribe.dmg
          if-no-files-found: error
      # The new appcast, which offers the update once the release is published (make appcast).
      - if: env.KIND != 'test'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-appcast
          path: build/release/${{ env.VERSION }}/appcast.xml
          if-no-files-found: error
      # The archive's debug symbols make crash reports from this version readable. make appcast
      # fetches it, since GitHub deletes it after 90 days.
      - name: Pack the app's archive
        if: env.KIND == 'release'
        working-directory: build/release/${{ env.VERSION }}
        run: ditto -c -k --keepParent LiveTranscribe.xcarchive LiveTranscribe.xcarchive.zip
      - if: env.KIND == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-archive
          path: build/release/${{ env.VERSION }}/LiveTranscribe.xcarchive.zip
          if-no-files-found: error
          retention-days: 90
      # A test build's logs, to see why it failed. A signed build's aren't kept: they name the team.
      - if: failure() && env.KIND == 'test'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-logs
          path: build/release/${{ env.VERSION }}/logs

  linux:
    name: Build the Linux packages
    needs: plan
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    defaults:
      run:
        # A container job's steps run in sh unless told otherwise.
        shell: bash
        working-directory: linux-windows
    steps:
      # Tauri's list for Ubuntu, ALSA, which cpal records through, and what opens an rpm.
      - name: Install the build dependencies
        working-directory: /
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >-
          apt-get update && apt-get install --yes --no-install-recommends
          ca-certificates curl git build-essential pkg-config file xdg-utils
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
          libssl-dev libasound2-dev libarchive-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: linux-windows
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.12.0 --locked
      # The packages take the app crate's version, which is 0.0.0 outside a release.
      - name: Give the app the release's version
        if: needs.plan.outputs.kind == 'release'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" crates/app/Cargo.toml
          grep -qx "version = \"$VERSION\"" crates/app/Cargo.toml
      - name: Fetch the OpenVINO runtime
        run: packaging/linux/fetch-openvino.sh
      # The speech-only sherpa-onnx libraries, which the sherpa-onnx crate links (.cargo/config.toml).
      - name: Fetch the sherpa-onnx libraries
        run: packaging/fetch-sherpa-onnx.sh
      - name: Build the packages
        working-directory: linux-windows/crates/app
        env:
          # linuxdeploy is an AppImage itself, and the container has no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo tauri build --bundles deb,rpm,appimage
      # Tauri names them after the product, "Live Transcribe", space and all.
      - name: Name the files as the packages are named
        working-directory: linux-windows/target/release/bundle
        run: |
          mkdir -p ../packages
          for file in deb/*.deb rpm/*.rpm appimage/*.AppImage; do
            name=$(basename "$file")
            mv "$file" "../packages/${name/Live Transcribe/live-transcribe}"
          done
          ls -l ../packages
      # Intel's licence allows shipping its libraries only unmodified.
      - name: Check that each package carries Intel's libraries unmodified
        run: packaging/linux/check-packages.sh target/release/packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: linux-windows/target/release/packages/*
          if-no-files-found: error

  release:
    name: Draft the release
    if: needs.plan.outputs.kind == 'release'
    needs: [plan, mac, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            .github/release-notes.md
            scripts/release-notes.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mac-app
          path: downloads
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: downloads
      # The notes name the Linux packages by version, and the website links to the disk image.
      - name: Check that every download is there
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ls -l downloads
          for file in LiveTranscribe.dmg "live-transcribe_${VERSION}_amd64.deb" \
            "live-transcribe-${VERSION}-1.x86_64.rpm" "live-transcribe_${VERSION}_amd64.AppImage"; do
            [ -f "downloads/$file" ] || { echo "The release has no $file" >&2; exit 1; }
          done
          [ "$(find downloads -type f | wc -l)" = 4 ] || { echo "The release has files it shouldn't" >&2; exit 1; }
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          scripts/release-notes.sh "$VERSION" > notes.md
          (cd downloads && sha256sum -- * > SHA256SUMS)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Live Transcribe $VERSION" --notes-file notes.md downloads/*
