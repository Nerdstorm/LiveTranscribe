# Live Transcribe for Linux and Windows. One crate per slice, mirroring the Mac app's Swift
# package (Packages/LiveTranscribeKit), so a rule lives in the same-named place in both. The
# golden cases in ../Fixtures/golden keep the two implementations typing the same text.
[workspace]
resolver = "3"
members = ["crates/*"]
# The openvino crate, with a way to pass properties to compile_model: see vendor/openvino/VENDORED.md.
exclude = ["vendor/openvino"]

[patch.crates-io]
openvino = { path = "vendor/openvino" }

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
lt-shared = { path = "crates/shared" }
lt-styles = { path = "crates/styles" }
lt-spoken-commands = { path = "crates/spoken-commands" }
lt-snippets = { path = "crates/snippets" }
lt-vocabulary = { path = "crates/vocabulary" }
lt-cleanup = { path = "crates/cleanup" }
lt-dictation = { path = "crates/dictation" }
lt-transcription = { path = "crates/transcription" }
lt-language-model = { path = "crates/language-model" }
lt-hotkey = { path = "crates/hotkey" }
lt-capture = { path = "crates/capture" }
lt-insertion = { path = "crates/insertion" }
lt-dictation-ui = { path = "crates/dictation-ui" }
lt-wayland = { path = "crates/wayland" }
lt-windows = { path = "crates/windows" }

ab_glyph = "0.2"
anyhow = "1"
# Unpacking the speech models sherpa-onnx publishes, .tar.bz2 archives, with the versions the build
# already has (zip's bzip2, and sherpa-onnx-sys's tar).
bzip2 = "0.5"
clap = { version = "4", features = ["derive"] }
# The Windows clipboard behind a safe API, for dictated text nothing could take: the text, and the
# formats that keep it out of the clipboard history. BSL-1.0 (permissive, as MIT is); arboard, which
# wraps it, would add image support and an older windows-sys. Pinned: it was read at this version.
clipboard-win = "=5.4.1"
cpal = "0.18"
dirs = "6"
evdev = "0.13"
fontdb = "0.24"
hound = "3"
openvino = { version = "0.11", features = ["runtime-linking"] }
realfft = "3"
# Downloading the speech model: TLS through rustls with ring, the certificates the system trusts.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rubato = "5"
rustix = { version = "1", features = ["event", "fs", "pipe"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Speech to text for the catalog's other models, linked to the speech-only sherpa-onnx libraries
# that packaging/fetch-sherpa-onnx.sh fetches (see .cargo/config.toml). Pinned exactly: the crate's
# C structs must be the libraries' own, and the script fetches this version's.
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }
tar = { version = "0.4", default-features = false }
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-build = "2.7"
tiny-skia = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
unicode-properties = "0.1"
unicode-segmentation = "1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Win32 behind safe wrappers, for typing on Windows (SendInput, the focused window and control, and
# whether an app runs as administrator) and attaching to the console: the windows crate's calls are
# all unsafe, which the workspace forbids. MIT, no dependencies, released monthly. Pinned exactly:
# its API still changes between 0.0 versions, and it was read at this one.
winsafe = { version = "=0.0.29", features = ["advapi", "user"] }
# Windows' low-level keyboard hook (WH_KEYBOARD_LL) behind a safe API, for the dictation hotkey: it
# reports each key's press and release wherever the focus is, and never translates keys (as rdev
# does, which breaks dead keys in the focused app). MIT. Pinned: it was read at this version.
willhook = "=0.6.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The text rules walk strings character by character (grapheme clusters), which is ten times
# slower unoptimised. Light optimisation in debug builds, and full for dependencies, keeps the
# golden cases at about a second under `cargo test`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
