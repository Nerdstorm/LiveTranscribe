<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app icon for 16 pixels, where AppIcon.svg's detail blurs: three bars and a
       one-pixel cursor, every edge on the 16-pixel grid (64 points to a pixel). The body fills
       14 of the 16 pixels, and there is no shadow at this size. Keep it in step with
       AppIcon.svg; after editing, run scripts/render-icons.sh. -->
  <defs>
    <linearGradient id="background" gradientUnits="userSpaceOnUse" x1="0" y1="64" x2="0" y2="960">
      <stop offset="0" stop-color="#3d8bff"/>
      <stop offset="1" stop-color="#0a4db8"/>
    </linearGradient>
  </defs>

  <path fill="url(#background)" d="M 372.18 64.00
             L 651.82 64.00 C 740.56 64.00 784.93 64.00 824.94 77.20 C 884.84 97.94 926.06 139.16 946.80 199.06 C 960.00 239.07 960.00 283.44 960.00 372.18
             L 960.00 651.82 C 960.00 740.56 960.00 784.93 946.80 824.94 C 926.06 884.84 884.84 926.06 824.94 946.80 C 784.93 960.00 740.56 960.00 651.82 960.00
             L 372.18 960.00 C 283.44 960.00 239.07 960.00 199.06 946.80 C 139.16 926.06 97.94 884.84 77.20 824.94 C 64.00 784.93 64.00 740.56 64.00 651.82
             L 64.00 372.18 C 64.00 283.44 64.00 239.07 77.20 199.06 C 97.94 139.16 139.16 97.94 199.06 77.20 C 239.07 64.00 283.44 64.00 372.18 64.00 Z"/>

  <!-- The waveform: three bars, two pixels wide. -->
  <rect x="192" y="384" width="128" height="256" rx="32" fill="#ffffff"/>
  <rect x="384" y="256" width="128" height="512" rx="32" fill="#ffffff"/>
  <rect x="576" y="320" width="128" height="384" rx="32" fill="#ffffff"/>
  <!-- The text cursor: a one-pixel I-beam. -->
  <g fill="#ffc933">
    <rect x="768" y="192" width="64" height="640"/>
    <rect x="704" y="192" width="192" height="64"/>
    <rect x="704" y="768" width="192" height="64"/>
  </g>
</svg>
